<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Nummi</title>
    <!-- iOS: cuando se agrega a la pantalla de inicio, corre sin la barra de
         Safari — sin esto, la franja del status bar (hora/batería) queda
         blanca en vez de combinar con el tema oscuro de la app. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nummi" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Fondo del documento (no de la app en sí, eso lo pinta React): sin
         esto, en iOS standalone la franja del home indicator (abajo de
         todo, debajo de la tab bar) queda blanca por default del navegador
         en vez de combinar con el tema — pasa antes de que React monte y en
         cualquier resquicio de layout que la tab bar no llegue a cubrir. */
      html,
      body,
      #root {
        background-color: #f4f5f7;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body,
        #root {
          background-color: #0d0f14;
        }
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
